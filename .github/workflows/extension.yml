name: Extension

on:
  pull_request:
    paths: ['extension/**']
  # ext-v1.0.0 publishes the VS Code extension to both marketplaces.
  push:
    tags: ['ext-v*']

defaults:
  run:
    working-directory: extension

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npx tsc -p ./ --noEmit
      - run: npx vsce package --no-dependencies -o relay.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: relay-vsix
          path: extension/relay.vsix

  publish:
    if: startsWith(github.ref, 'refs/tags/ext-v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: relay-vsix
          path: extension
      # Same .vsix to both: VS Code uses the Visual Studio Marketplace;
      # Cursor, Windsurf and VSCodium install from Open VSX.
      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --packagePath relay.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: npx --yes ovsx publish relay.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}