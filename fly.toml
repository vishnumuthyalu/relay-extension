# fly.toml app configuration file generated for relay-vishnu on 2026-10-19T12:19:31-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'relay-vishnu'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'node lib/db/migrate.js'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[processes]
  web = 'node server.js'
  worker = 'node worker.js'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1
  processes = ['web']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/ready'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['web', 'worker']
